<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
    <a-scene mindar-image="imageTargetSrc: https://raw.githubusercontent.com/ZekturCh/BKARexp/gh-pages/targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <!-- Carga de activos -->
      <a-assets>
        <a-asset-item id="nuevoModelo" src="https://raw.githubusercontent.com/ZekturCh/BKARexp/gh-pages/assets/asset3.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Objeto que aparecerá al detectar la imagen -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model src="#nuevoModelo" position="0 -0.25 0" scale="1 1 1" animation-mixer></a-gltf-model>
      </a-entity>
      
    </a-scene>
</body>
</html>
