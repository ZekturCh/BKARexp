<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
    <a-scene 
        mindar-image="imageTargetSrc: https://raw.githubusercontent.com/ZekturCh/BKARexp/gh-pages/targets.mind;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
      
      <!-- Carga de video -->
      <a-assets>
        <video id="videoTransparente" autoplay loop playsinline muted>
          <source src="https://raw.githubusercontent.com/ZekturCh/BKARexp/gh-pages/assets/video-transparente.webm" type="video/webm">
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Objeto que aparecerá al detectar la imagen -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Plano con video -->
        <a-video src="#videoTransparente" width="1.5" height="1" position="0 0 0" scale="1 1 1"></a-video>
      </a-entity>
      
    </a-scene>
</body>
</html>
