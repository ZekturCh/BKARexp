<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR con Captura y Compartir</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://rawgit.com/jeromeetienne/AR.js/1.7.2/aframe/build/aframe-ar.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
            transition: background 0.3s;
        }
        .active {
            background: #28a745 !important;
        }
    </style>
</head>
<body>
    <a-scene id="scene" embedded arjs vr-mode-ui="enabled: false" renderer="alpha: true; preserveDrawingBuffer: true;">
        <a-assets>
            <a-asset-item id="model" src="https://zekturch.github.io/BKARexp/assets/asset.glb"></a-asset-item>
        </a-assets>

        <a-marker-camera preset='custom'></a-marker-camera>

        <a-entity id="model-container" gltf-model="#model" position="0 0 -2" scale="1 1 1"></a-entity>
        
        <a-camera position="0 1.6 0" wasd-controls-enabled="true"></a-camera>
    </a-scene>

    <div id="buttons">
        <button id="move-btn">Mover</button>
        <button id="rotate-btn">Rotar</button>
        <button id="scale-btn">Escalar</button>
        <button id="capture-btn">📷 Capturar</button>
    </div>

    <script>
        document.getElementById("capture-btn").addEventListener("click", takeScreenshot);

        window.onload = async function () {
            try {
                await navigator.mediaDevices.getUserMedia({ video: true });
                console.log("Cámara activada correctamente.");
            } catch (error) {
                console.error("Error accediendo a la cámara:", error);
            }
        };

        async function takeScreenshot() {
            let scene = document.querySelector("a-scene");
            let rendererCanvas = scene.renderer.domElement;

            let tempCanvas = document.createElement("canvas");
            tempCanvas.width = rendererCanvas.width;
            tempCanvas.height = rendererCanvas.height;
            let ctx = tempCanvas.getContext("2d");

            let img = new Image();
            img.onload = () => {
                ctx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
                ctx.drawImage(img, 0, 0);
                let imageData = tempCanvas.toDataURL("image/png");

                let link = document.createElement("a");
                link.href = imageData;
                link.download = "AR_capture.png";
                link.click();
            };
            img.src = rendererCanvas.toDataURL("image/png");
        }

        let model = document.getElementById("model-container");
        let mode = "";
        let lastX, lastY;

        function setMode(newMode, button) {
            mode = newMode;
            document.querySelectorAll("#buttons button").forEach(btn => btn.classList.remove("active"));
            button.classList.add("active");
        }

        document.getElementById("move-btn").addEventListener("click", (e) => setMode("move", e.target));
        document.getElementById("rotate-btn").addEventListener("click", (e) => setMode("rotate", e.target));
        document.getElementById("scale-btn").addEventListener("click", (e) => setMode("scale", e.target));

        function handleMove(event) {
            if (!mode) return;

            let clientX = event.touches ? event.touches[0].clientX : event.clientX;
            let clientY = event.touches ? event.touches[0].clientY : event.clientY;

            if (lastX === undefined || lastY === undefined) {
                lastX = clientX;
                lastY = clientY;
                return;
            }

            let deltaX = (clientX - lastX) * 0.5;
            let deltaY = (clientY - lastY) * 0.5;

            let pos = model.getAttribute("position");
            let rot = model.getAttribute("rotation");
            let scale = model.getAttribute("scale");

            if (mode === "move") {
                model.setAttribute("position", `${pos.x + deltaX * 0.01} ${pos.y - deltaY * 0.01} ${pos.z}`);
            } else if (mode === "rotate") {
                model.setAttribute("rotation", `${rot.x - deltaY} ${rot.y + deltaX} ${rot.z}`);
            } else if (mode === "scale") {
                let newScale = Math.max(0.2, scale.x + deltaY * 0.01);
                model.setAttribute("scale", `${newScale} ${newScale} ${newScale}`);
            }

            lastX = clientX;
            lastY = clientY;
        }

        function resetLastTouch() {
            lastX = undefined;
            lastY = undefined;
        }

        document.addEventListener("mousemove", handleMove);
        document.addEventListener("touchmove", handleMove);
        document.addEventListener("mouseup", resetLastTouch);
        document.addEventListener("touchend", resetLastTouch);
    </script>
</body>
</html>
