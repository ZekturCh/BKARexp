<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR - Manipulación de Modelo 3D</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
            transition: background 0.3s;
        }
        .active {
            background: #28a745 !important;
        }
    </style>
</head>
<body>
   <a-scene id="scene" embedded arjs="sourceType: webcam; facingMode: user;" renderer="preserveDrawingBuffer: true;">
        <a-assets>
            <a-asset-item id="model" src="https://zekturch.github.io/BKARexp/assets/asset.glb"></a-asset-item>
        </a-assets>
        <a-entity id="model-container" gltf-model="#model" position="0 0 -2" scale="1 1 1"></a-entity>
        <a-camera position="0 1.6 0"></a-camera>
    </a-scene>

    <div id="buttons">
        <button id="move-btn">Mover</button>
        <button id="rotate-btn">Rotar</button>
        <button id="scale-btn">Escalar</button>
        <button id="capture-btn">📷 Capturar</button>
    </div>

   <script>
async function takeScreenshot() {
    let scene = document.querySelector("a-scene");
    let rendererCanvas = scene.renderer.domElement; // WebGL Canvas
    let arCanvas = scene.querySelector("canvas"); // AR.js Canvas

    // Create a new canvas to merge images
    let finalCanvas = document.createElement("canvas");
    let ctx = finalCanvas.getContext("2d");
    finalCanvas.width = rendererCanvas.width;
    finalCanvas.height = rendererCanvas.height;

    try {
        // Draw AR canvas first
        ctx.drawImage(arCanvas, 0, 0, finalCanvas.width, finalCanvas.height);

        // Draw WebGL scene on top
        ctx.drawImage(rendererCanvas, 0, 0, finalCanvas.width, finalCanvas.height);

        // Convert the final canvas to an image
        let finalImage = finalCanvas.toDataURL("image/png");
        downloadAndShare(finalImage);
    } catch (error) {
        console.error("Screenshot failed:", error);
    }
}

// Download and share the final screenshot
function downloadAndShare(imgData) {
    let link = document.createElement("a");
    link.href = imgData;
    link.download = "screenshot.png";
    link.click();

    if (navigator.share) {
        navigator.share({
            title: "AR Screenshot",
            text: "Check out this AR capture!",
            files: [new File([dataURItoBlob(imgData)], "screenshot.png", { type: "image/png" })]
        }).catch(console.error);
    } else {
        alert("Screenshot saved! Share it manually.");
    }
}

// Convert Data URL to Blob
function dataURItoBlob(dataURI) {
    let byteString = atob(dataURI.split(",")[1]);
    let mimeString = dataURI.split(",")[0].split(":")[1].split(";")[0];
    let ab = new ArrayBuffer(byteString.length);
    let ia = new Uint8Array(ab);
    for (let i = 0; i < byteString.length; i++) {
        ia[i] = byteString.charCodeAt(i);
    }
    return new Blob([ab], { type: mimeString });
}

document.getElementById("capture-btn").addEventListener("click", takeScreenshot);

let model = document.getElementById("model-container");
let mode = "";
let lastX, lastY;

function setMode(newMode, button) {
    mode = newMode;
    document.querySelectorAll("#buttons button").forEach(btn => btn.classList.remove("active"));
    button.classList.add("active");
}

document.getElementById("move-btn").addEventListener("click", (e) => setMode("move", e.target));
document.getElementById("rotate-btn").addEventListener("click", (e) => setMode("rotate", e.target));
document.getElementById("scale-btn").addEventListener("click", (e) => setMode("scale", e.target));

function handleMove(event) {
    if (!mode) return;
    let clientX = event.touches ? event.touches[0].clientX : event.clientX;
    let clientY = event.touches ? event.touches[0].clientY : event.clientY;
    if (lastX === undefined || lastY === undefined) {
        lastX = clientX;
        lastY = clientY;
        return;
    }
    let deltaX = (clientX - lastX) * 0.5;
    let deltaY = (clientY - lastY) * 0.5;
    let pos = model.getAttribute("position");
    let rot = model.getAttribute("rotation");
    let scale = model.getAttribute("scale");

    if (mode === "move") {
        model.setAttribute("position", `${pos.x + deltaX * 0.01} ${pos.y - deltaY * 0.01} ${pos.z}`);
    } else if (mode === "rotate") {
        model.setAttribute("rotation", `${rot.x - deltaY} ${rot.y + deltaX} ${rot.z}`);
    } else if (mode === "scale") {
        let newScale = Math.max(0.2, scale.x + deltaY * 0.01);
        model.setAttribute("scale", `${newScale} ${newScale} ${newScale}`);
    }

    lastX = clientX;
    lastY = clientY;
}

function resetLastTouch() {
    lastX = undefined;
    lastY = undefined;
}

document.addEventListener("mousemove", handleMove);
document.addEventListener("touchmove", handleMove);
document.addEventListener("mouseup", resetLastTouch);
document.addEventListener("touchend", resetLastTouch);

function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent);
}
</script>
</body>
</html>
