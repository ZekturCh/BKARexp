<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR - Manipulación de Modelo 3D</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
            transition: background 0.3s;
        }
        .active {
            background: #28a745 !important; /* Verde */
        }
    </style>
</head>
<body>
    <a-scene id="scene" embedded arjs="sourceType: webcam; facingMode: user;">
        <a-assets>
            <a-asset-item id="model" src="https://zekturch.github.io/BKARexp/assets/asset.glb"></a-asset-item>
        </a-assets>
        <a-entity id="model-container" gltf-model="#model" position="0 0 -2" scale="1 1 1"></a-entity>
        <a-camera position="0 1.6 0"></a-camera>
    </a-scene>

    <div id="buttons">
        <button id="move-btn">Mover</button>
        <button id="rotate-btn">Rotar</button>
        <button id="scale-btn">Escalar</button>
        <button id="capture-btn">Capturar</button>
    </div>

    <script>

//COMPROBAR LOG PERMITIDO Y CÓDIGO DE FUNCIÓN
window.onload = function () {
            if (sessionStorage.getItem("accesoPermitido") !== "true") {
                alert("Acceso denegado. Primero ingresa un código válido.");
                window.location.href = "index.html"; // Redirige a la página de registro
            }
        };
        let model = document.getElementById("model-container");
        let mode = "";
        let lastX, lastY;
        let useFrontCamera = false; // Estado de la cámara (false = trasera, true = frontal)

        // Guardar referencia a los botones
        let moveBtn = document.getElementById("move-btn");
        let rotateBtn = document.getElementById("rotate-btn");
        let scaleBtn = document.getElementById("scale-btn");

        
scene.renderer.alpha = true; // Mantener fondo transparente
scene.renderer.autoClear = false; // Evitar limpiar buffer

// Para dispositivos móviles, añadir meta tag
document.head.innerHTML += `
<meta name="viewport" content="width=device-width, user-scalable=no, 
    initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">`;
        // ✅ Función para cambiar modo y actualizar estilos
        function setMode(newMode, button) {
            mode = newMode;
            // 🔥 Quita la clase "active" de todos los botones
            document.querySelectorAll("#buttons button").forEach(btn => btn.classList.remove("active"));
            // ✅ Agrega la clase "active" al botón seleccionado
            button.classList.add("active");
        }

        // Asignar eventos a los botones
        moveBtn.addEventListener("click", () => setMode("move", moveBtn));
        rotateBtn.addEventListener("click", () => setMode("rotate", rotateBtn));
        scaleBtn.addEventListener("click", () => setMode("scale", scaleBtn));

        function handleMove(event) {
            if (!mode) return;

            let clientX = event.touches ? event.touches[0].clientX : event.clientX;
            let clientY = event.touches ? event.touches[0].clientY : event.clientY;

            if (lastX === undefined || lastY === undefined) {
                lastX = clientX;
                lastY = clientY;
                return;
            }

            let deltaX = (clientX - lastX) * 0.5;
            let deltaY = (clientY - lastY) * 0.5;

            let pos = model.getAttribute("position");
            let rot = model.getAttribute("rotation");
            let scale = model.getAttribute("scale");

            if (mode === "move") {
                model.setAttribute("position", `${pos.x + deltaX * 0.01} ${pos.y - deltaY * 0.01} ${pos.z}`);
            } else if (mode === "rotate") {
                model.setAttribute("rotation", `${rot.x - deltaY} ${rot.y + deltaX} ${rot.z}`);
            } else if (mode === "scale") {
                let newScale = Math.max(0.2, scale.x + deltaY * 0.01);
                model.setAttribute("scale", `${newScale} ${newScale} ${newScale}`);
            }

            lastX = clientX;
            lastY = clientY;
        }

        function resetLastTouch() {
            lastX = undefined;
            lastY = undefined;
        }

        document.addEventListener("mousemove", handleMove);
        document.addEventListener("touchmove", handleMove);
        document.addEventListener("mouseup", resetLastTouch);
        document.addEventListener("touchend", resetLastTouch);

AFRAME.registerComponent('optimize-model', {
    init: function () {
        this.el.getObject3D('mesh').traverse(node => {
            if (node.isMesh) {
                node.material.needsUpdate = true;
                node.castShadow = false;
                node.receiveShadow = false;
            }
        });
    }
});

window.onload = function () {
    if (sessionStorage.getItem("accesoPermitido") !== "true") {
        alert("Acceso denegado. Primero ingresa un código válido.");
        window.location.href = "index.html"; // Redirige a la página de registro
    }

    initializeAR(); // Inicializar AR al cargar

    // Guardar referencia a los botones
    let moveBtn = document.getElementById("move-btn");
    let rotateBtn = document.getElementById("rotate-btn");
    let scaleBtn = document.getElementById("scale-btn");

    // Asignar eventos a los botones
    moveBtn.addEventListener("click", () => setMode("move", moveBtn));
    rotateBtn.addEventListener("click", () => setMode("rotate", rotateBtn));
    scaleBtn.addEventListener("click", () => setMode("scale", scaleBtn));

    // Evento para cambiar cámara
    document.getElementById('switch-camera').addEventListener('click', () => {
        currentCamera = currentCamera === 'user' ? 'environment' : 'user';
        initializeAR();
    });

    // Evento para captura de pantalla
    document.getElementById('capture-btn').addEventListener('click', async () => {
        await captureAndShare();
    });
};

// Variables globales
let currentCamera = 'user'; // 'user' = frontal, 'environment' = trasera
let activeStream = null;

// Función para inicializar AR
function initializeAR() {
    if (activeStream) {
        activeStream.getTracks().forEach(track => track.stop());
    }

    const constraints = {
        video: {
            facingMode: { exact: currentCamera },
            width: { ideal: 1280 },
            height: { ideal: 720 }
        }
    };

    navigator.mediaDevices.getUserMedia(constraints)
        .then(stream => {
            activeStream = stream;
            const videoElement = document.querySelector('video');
            videoElement.srcObject = stream;
            videoElement.play();
            restartARScene(); // Reiniciar escena después de obtener el stream
        })
        .catch(error => console.error('Error al acceder a la cámara:', error));
}

// Función para reiniciar la escena AR
function restartARScene() {
    const oldScene = document.querySelector('a-scene');
    if (oldScene) {
        oldScene.parentNode.removeChild(oldScene);
    }

    const newScene = document.createElement('a-scene');
    newScene.setAttribute('embedded', '');
    newScene.setAttribute('arjs', `sourceType: webcam; facingMode: ${currentCamera}; debugUIEnabled: false;`);

    newScene.innerHTML = `
        <a-assets>
            <a-asset-item id="model" src="https://zekturch.github.io/BKARexp/assets/asset.glb"></a-asset-item>
        </a-assets>
        <a-entity id="model-container" gltf-model="#model" position="0 0 -2" scale="1 1 1"></a-entity>
        <a-camera position="0 1.6 0"></a-camera>
    `;
    
    document.body.insertBefore(newScene, document.body.firstChild);
}

// Función para capturar y compartir imagen
async function captureAndShare() {
    const scene = document.querySelector('a-scene');
    const video = document.querySelector('video');

    const modelCanvas = scene.components.screenshot.getCanvas('perspective');
    
    const videoCanvas = document.createElement('canvas');
    videoCanvas.width = video.videoWidth;
    videoCanvas.height = video.videoHeight;
    
    videoCanvas.getContext('2d').drawImage(video, 0, 0);
    
    const finalCanvas = document.createElement('canvas');
    finalCanvas.width = videoCanvas.width;
    finalCanvas.height = videoCanvas.height;
    
    const ctx = finalCanvas.getContext('2d');
    
    ctx.drawImage(videoCanvas, 0, 0);
    ctx.drawImage(modelCanvas, 0, 0, finalCanvas.width, finalCanvas.height);
    
    finalCanvas.toBlob(async (blob) => {
        const file = new File([blob], 'ARcaptura.png', { type: 'image/png' });
        
        try {
            if (navigator.share) {
                await navigator.share({
                    files: [file],
                    title: 'Mi creación AR',
                    text: '¡Mira lo que hice con realidad aumentada!'
                });
            } else {
                const link = document.createElement('a');
                link.download = 'ARcaptura.png';
                link.href = URL.createObjectURL(file);
                link.click();
            }
        } catch (err) {
            console.log('Error al compartir:', err);
        }
        
    }, 'image/png');
}

// Meta viewport para móviles
document.head.innerHTML += `
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">`;
</script>
</body>
</html>
