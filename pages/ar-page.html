<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR con Cámara y Modelo 3D</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://threejs.org/build/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; text-align: center; }
        video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; }
        #controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
        button { padding: 10px; font-size: 16px; cursor: pointer; }
        canvas { position: fixed; top: 0; left: 0; pointer-events: none; }
    </style>
</head>
<body>
    <video id="camera" autoplay playsinline></video>
    <a-scene embedded>
        <a-assets>
            <a-asset-item id="model" src="https://zekturch.github.io/BKARexp/assets/asset.glb"></a-asset-item>
        </a-assets>
        <a-entity id="model-container" gltf-model="#model" position="0 0 -2" rotation="0 180 0"></a-entity>
        <a-camera position="0 1.6 0"></a-camera>
    </a-scene>
    <canvas id="captureCanvas"></canvas>
    <div id="controls">
        <button onclick="switchCamera()">Cambiar Cámara</button>
        <button onclick="takeScreenshot()">📷 Capturar</button>
    </div>

    <script>
        let currentFacingMode = 'environment';
        let video = document.getElementById("camera");

        async function startCamera() {
            let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode } });
            video.srcObject = stream;
        }

        function switchCamera() {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            startCamera();
        }

        function takeScreenshot() {
            let canvas = document.getElementById("captureCanvas");
            let ctx = canvas.getContext("2d");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            let rendererCanvas = document.querySelector("a-scene").renderer.domElement;
            ctx.drawImage(rendererCanvas, 0, 0, canvas.width, canvas.height);

            let img = document.createElement("a");
            img.href = canvas.toDataURL("image/png");
            img.download = "screenshot.png";
            img.click();
        }

        startCamera();
    </script>
</body>
</html>
