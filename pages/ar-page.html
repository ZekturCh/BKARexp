<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR - Manipulación de Modelo 3D</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
            transition: background 0.3s;
        }
        .active {
            background: #28a745 !important;
        }
    </style>
</head>
<body>
   <a-scene id="scene" embedded arjs="sourceType: webcam; facingMode: user;" renderer="preserveDrawingBuffer: true;">
        <a-assets>
            <a-asset-item id="model" src="https://zekturch.github.io/BKARexp/assets/asset.glb"></a-asset-item>
        </a-assets>
        <a-entity id="model-container" gltf-model="#model" position="0 0 -2" scale="1 1 1"></a-entity>
        <a-camera position="0 1.6 0"></a-camera>
    </a-scene>

    <div id="buttons">
        <button id="move-btn">Mover</button>
        <button id="rotate-btn">Rotar</button>
        <button id="scale-btn">Escalar</button>
        <button id="capture-btn">📷 Capturar</button>
    </div>

   <script>
// Function to capture the AR scene
function takeScreenshot() {
    const scene = document.querySelector("a-scene");
    if (scene && scene.renderer) {
        // Use AR.js's built-in method to capture the scene
        scene.renderer.domElement.toBlob((blob) => {
            if (blob) {
                const url = URL.createObjectURL(blob);
                downloadAndShare(url);
            } else {
                console.error("Failed to capture the scene.");
            }
        }, 'image/png');
    } else {
        console.error("Scene or renderer not found.");
    }
}

// Download and share the final screenshot
function downloadAndShare(imgUrl) {
    const link = document.createElement("a");
    link.href = imgUrl;
    link.download = "screenshot.png";
    link.click();

    if (navigator.share) {
        fetch(imgUrl)
            .then((response) => response.blob())
            .then((blob) => {
                navigator.share({
                    title: "AR Screenshot",
                    text: "Check out this AR capture!",
                    files: [new File([blob], "screenshot.png", { type: "image/png" })],
                }).catch(console.error);
            });
    } else {
        alert("Screenshot saved! Share it manually.");
    }
}

// Attach the screenshot function to the button
document.getElementById("capture-btn").addEventListener("click", takeScreenshot);

// Model manipulation logic
let model = document.getElementById("model-container");
let mode = "";
let lastX, lastY;

function setMode(newMode, button) {
    mode = newMode;
    document.querySelectorAll("#buttons button").forEach(btn => btn.classList.remove("active"));
    button.classList.add("active");
}

document.getElementById("move-btn").addEventListener("click", (e) => setMode("move", e.target));
document.getElementById("rotate-btn").addEventListener("click", (e) => setMode("rotate", e.target));
document.getElementById("scale-btn").addEventListener("click", (e) => setMode("scale", e.target));

function handleMove(event) {
    if (!mode) return;
    let clientX = event.touches ? event.touches[0].clientX : event.clientX;
    let clientY = event.touches ? event.touches[0].clientY : event.clientY;
    if (lastX === undefined || lastY === undefined) {
        lastX = clientX;
        lastY = clientY;
        return;
    }
    let deltaX = (clientX - lastX) * 0.5;
    let deltaY = (clientY - lastY) * 0.5;
    let pos = model.getAttribute("position");
    let rot = model.getAttribute("rotation");
    let scale = model.getAttribute("scale");

    if (mode === "move") {
        model.setAttribute("position", `${pos.x + deltaX * 0.01} ${pos.y - deltaY * 0.01} ${pos.z}`);
    } else if (mode === "rotate") {
        model.setAttribute("rotation", `${rot.x - deltaY} ${rot.y + deltaX} ${rot.z}`);
    } else if (mode === "scale") {
        let newScale = Math.max(0.2, scale.x + deltaY * 0.01);
        model.setAttribute("scale", `${newScale} ${newScale} ${newScale}`);
    }

    lastX = clientX;
    lastY = clientY;
}

function resetLastTouch() {
    lastX = undefined;
    lastY = undefined;
}

document.addEventListener("mousemove", handleMove);
document.addEventListener("touchmove", handleMove);
document.addEventListener("mouseup", resetLastTouch);
document.addEventListener("touchend", resetLastTouch);
</script>
</body>
</html>
