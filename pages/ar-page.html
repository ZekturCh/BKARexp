<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Mobile</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script> <!-- Versión actualizada -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
            transition: background 0.3s;
        }
        .active {
            background: #28a745 !important;
        }
        #screenshot-btn {
            background: #dc3545;
        }
    </style>
</head>
<body>
   <a-scene id="scene" embedded arjs="sourceType: webcam; facingMode: user; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
  <a-marker preset="hiro">
    <a-entity id="model-container" gltf-model="#model" position="0 0 -2" scale="1 1 1"></a-entity>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>

    <div id="buttons">
        <button id="move-btn">Mover</button>
        <button id="rotate-btn">Rotar</button>
        <button id="scale-btn">Escalar</button>
        <button id="screenshot-btn">Capturar</button>
    </div>

    <script>
        // ===== [1. Verificar carga del modelo] =====
        document.querySelector('#model-container').addEventListener('model-loaded', () => {
            console.log('Modelo 3D cargado!');
            document.querySelector('#model-container').setAttribute('visible', 'true');
        });

        // ===== [2. Configuración AR.js optimizada] =====
        AFRAME.registerComponent('gesture-detector', {
            init: function() {
                this.scene = document.querySelector('a-scene');
                this.initialScale = 0.3;
                
                // Esperar a que AR.js esté listo
                this.scene.addEventListener('arReady', () => {
                    console.log('AR.js inicializado correctamente!');
                    this.model = document.querySelector('#model-container');
                    this.model.setAttribute('position', '0 0 -1');
                });
            }
        });

   class ScreenshotTaker {
  constructor() {
    this.mergeCanvas = document.createElement('canvas');
    this.mergeCtx = this.mergeCanvas.getContext('2d');
    this.setupButton();
  }

  setupButton() {
    const btn = document.getElementById('screenshot-btn');
    btn.addEventListener('click', () => this.capture());
  }

  async capture() {
    try {
      const { video, arCanvas } = this.getElements();
      await this.prepareCanvas(video, arCanvas);
      this.saveToGallery();
    } catch (error) {
      console.error('Capture failed:', error);
    }
  }

  getElements() {
    return {
      video: document.querySelector('[arjs-video]') || document.querySelector('video'),
      arCanvas: document.querySelector('canvas')
    };
  }

  prepareCanvas(video, arCanvas) {
    return new Promise(resolve => {
      // Corregir dimensiones
      this.mergeCanvas.width = arCanvas.width;
      this.mergeCanvas.height = arCanvas.height;
      
      // Eliminar el escalado manual
      this.mergeCtx.drawImage(video, 0, 0, this.mergeCanvas.width, this.mergeCanvas.height);
      this.mergeCtx.drawImage(arCanvas, 0, 0, this.mergeCanvas.width, this.mergeCanvas.height);
      resolve();
    });
  }

  saveToGallery() {
    this.mergeCanvas.toBlob(blob => {
      const file = new File([blob], `AR-${Date.now()}.png`, { type: 'image/png' });
      
      // Usar Web Share API para iOS
      if (navigator.share) {
        navigator.share({
          files: [file],
          title: 'AR Capture'
        }).catch(console.error);
      } else {
        // Método alternativo para Android
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = file.name;
        link.href = url;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }
    }, 'image/png');
  }
}

// Inicializar después de que cargue A-Frame
document.querySelector('a-scene').addEventListener('loaded', () => {
  new ScreenshotTaker();
});
    </script>
</body>
</html>
