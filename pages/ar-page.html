<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Mobile</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
            transition: background 0.3s;
        }
        .active { background: #28a745 !important; }
        #screenshot-btn { background: #dc3545; }
    </style>
</head>
<body>
    <a-scene vr-mode-ui="enabled: false" arjs>
        <a-assets>
            <a-asset-item id="model" src="https://zekturch.github.io/BKARexp/assets/asset.glb"></a-asset-item>
        </a-assets>
        <a-entity id="model-container" gltf-model="#model" position="0 0 -1" scale="0.3 0.3 0.3"></a-entity>
        <a-camera position="0 0 0"></a-camera>
    </a-scene>

    <div id="buttons">
        <button id="move-btn">Mover</button>
        <button id="rotate-btn">Rotar</button>
        <button id="scale-btn">Escalar</button>
        <button id="screenshot-btn">Capturar</button>
    </div>


    <script>
        const model = document.getElementById('model-container');
        let isMoving = false, isRotating = false, isScaling = false;

        document.getElementById('move-btn').addEventListener('click', () => {
            isMoving = !isMoving;
            isRotating = isScaling = false;
        });
        document.getElementById('rotate-btn').addEventListener('click', () => {
            isRotating = !isRotating;
            isMoving = isScaling = false;
        });
        document.getElementById('scale-btn').addEventListener('click', () => {
            isScaling = !isScaling;
            isMoving = isRotating = false;
        });

        window.addEventListener('touchmove', (event) => {
            if (isMoving) {
                model.object3D.position.x += event.touches[0].movementX * 0.001;
                model.object3D.position.y -= event.touches[0].movementY * 0.001;
            }
            if (isRotating) {
                model.object3D.rotation.y += event.touches[0].movementX * 0.01;
            }
            if (isScaling) {
                model.object3D.scale.multiplyScalar(1 + event.touches[0].movementY * 0.001);
            }
        });

        document.getElementById('screenshot-btn').addEventListener('click', () => {
            const scene = document.querySelector('a-scene');
            scene.renderer.domElement.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'screenshot.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            });
        });
    </script>
</body>
</html>
