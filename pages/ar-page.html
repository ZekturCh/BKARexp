<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR - Manipulación de Modelo 3D</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas2image/0.1/canvas2image.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
            transition: background 0.3s;
        }
        .active {
            background: #28a745 !important; /* Verde */
        }
        #screenshot-btn {
          background: #dc3545; /* Red color for visual distinction */
        }
        
        /* Add this for iOS image preview */
        canvas {
          display: none; /* Keep our merge canvas hidden */
        }
    </style>
</head>
<body>
  <a-scene 
        id="scene" 
        embedded 
        arjs="
            sourceType: webcam;
            camera-facing: user;  <!-- Parámetro corregido -->
            trackingMethod: best; <!-- Usar SLAM para móviles -->
            renderer: logDepthBuffer: true; 
            debugUIEnabled: false;
        "
        vr-mode-ui="enabled: false"
    >
        <a-assets>
            <a-asset-item id="model" src="https://cdn.aframe.io/test-models/models/box/box.glb"></a-asset-item>
        </a-assets>

        <!-- MODELO 3D - POSICIÓN PARA MÓVILES -->
        <a-entity 
            id="model-container" 
            gltf-model="#model" 
            position="0 0 0" <!-- Posición inicial centrada -->
            scale="0.5 0.5 0.5" <!-- Escala reducida para móviles -->
            animation="property: rotation; to: 0 360 0; loop: true; dur: 10000"
        ></a-entity>

        <!-- CÁMARA PARA AR.js -->
        <a-entity 
            camera 
            position="0 1.6 0" 
            look-controls="enabled: false"
        ></a-entity>
    </a-scene>
    <div id="buttons">
        <button id="move-btn">Mover</button>
        <button id="rotate-btn">Rotar</button>
        <button id="scale-btn">Escalar</button>
        <button id="screenshot-btn">Capturar</button>
    </div>

    <script>
window.onload = function () {
            if (sessionStorage.getItem("accesoPermitido") !== "true") {
                alert("Acceso denegado. Primero ingresa un código válido.");
                window.location.href = "index.html"; // Redirige a la página de registro
            }
        };
        let model = document.getElementById("model-container");
        let mode = "";
        let lastX, lastY;
        let useFrontCamera = false; // Estado de la cámara (false = trasera, true = frontal)

        // Guardar referencia a los botones
        let moveBtn = document.getElementById("move-btn");
        let rotateBtn = document.getElementById("rotate-btn");
        let scaleBtn = document.getElementById("scale-btn");

        

        // ✅ Función para cambiar modo y actualizar estilos
        function setMode(newMode, button) {
            mode = newMode;
            // 🔥 Quita la clase "active" de todos los botones
            document.querySelectorAll("#buttons button").forEach(btn => btn.classList.remove("active"));
            // ✅ Agrega la clase "active" al botón seleccionado
            button.classList.add("active");
        }

        // Asignar eventos a los botones
        moveBtn.addEventListener("click", () => setMode("move", moveBtn));
        rotateBtn.addEventListener("click", () => setMode("rotate", rotateBtn));
        scaleBtn.addEventListener("click", () => setMode("scale", scaleBtn));

        function handleMove(event) {
            if (!mode) return;

            let clientX = event.touches ? event.touches[0].clientX : event.clientX;
            let clientY = event.touches ? event.touches[0].clientY : event.clientY;

            if (lastX === undefined || lastY === undefined) {
                lastX = clientX;
                lastY = clientY;
                return;
            }

            let deltaX = (clientX - lastX) * 0.5;
            let deltaY = (clientY - lastY) * 0.5;

            let pos = model.getAttribute("position");
            let rot = model.getAttribute("rotation");
            let scale = model.getAttribute("scale");

            if (mode === "move") {
                model.setAttribute("position", `${pos.x + deltaX * 0.01} ${pos.y - deltaY * 0.01} ${pos.z}`);
            } else if (mode === "rotate") {
                model.setAttribute("rotation", `${rot.x - deltaY} ${rot.y + deltaX} ${rot.z}`);
            } else if (mode === "scale") {
                let newScale = Math.max(0.2, scale.x + deltaY * 0.01);
                model.setAttribute("scale", `${newScale} ${newScale} ${newScale}`);
            }

            lastX = clientX;
            lastY = clientY;
        }

        function resetLastTouch() {
            lastX = undefined;
            lastY = undefined;
        }

        document.addEventListener("mousemove", handleMove);
        document.addEventListener("touchmove", handleMove);
        document.addEventListener("mouseup", resetLastTouch);
        document.addEventListener("touchend", resetLastTouch);

class ScreenshotTaker {
  constructor() {
    this.mergeCanvas = document.createElement('canvas');
    this.mergeCtx = this.mergeCanvas.getContext('2d');
    this.setupButton();
  }

  setupButton() {
    const btn = document.getElementById('screenshot-btn');
    btn.addEventListener('click', () => this.capture());
  }

  async capture() {
    try {
      const { video, arCanvas } = this.getElements();
      await this.prepareCanvas(video, arCanvas);
      this.saveToGallery();
    } catch (error) {
      console.error('Capture failed:', error);
    }
  }

  getElements() {
    return {
      video: document.querySelector('[arjs-video]') || document.querySelector('video'),
      arCanvas: document.querySelector('canvas')
    };
  }

  prepareCanvas(video, arCanvas) {
    return new Promise(resolve => {
      // Corregir dimensiones
      this.mergeCanvas.width = arCanvas.width;
      this.mergeCanvas.height = arCanvas.height;
      
      // Eliminar el escalado manual
      this.mergeCtx.drawImage(video, 0, 0, this.mergeCanvas.width, this.mergeCanvas.height);
      this.mergeCtx.drawImage(arCanvas, 0, 0, this.mergeCanvas.width, this.mergeCanvas.height);
      resolve();
    });
  }

  saveToGallery() {
    this.mergeCanvas.toBlob(blob => {
      const file = new File([blob], `AR-${Date.now()}.png`, { type: 'image/png' });
      
      // Usar Web Share API para iOS
      if (navigator.share) {
        navigator.share({
          files: [file],
          title: 'AR Capture'
        }).catch(console.error);
      } else {
        // Método alternativo para Android
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = file.name;
        link.href = url;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }
    }, 'image/png');
  }
}

// Inicializar después de que cargue A-Frame
document.querySelector('a-scene').addEventListener('loaded', () => {
  new ScreenshotTaker();
});
    </script>
</body>
</html>
