<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR - Manipulación de Modelo 3D</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
            transition: background 0.3s;
        }
        .active {
            background: #28a745 !important;
        }
    </style>
</head>
<body>
    <a-scene id="scene" embedded arjs="sourceType: webcam;" renderer="preserveDrawingBuffer: true; alpha: true">
        <a-assets>
            <a-asset-item id="model" src="https://zekturch.github.io/BKARexp/assets/asset.glb"></a-asset-item>
        </a-assets>
        
        <a-camera id="camera" position="0 1.6 0"></a-camera>
        <a-entity id="model-container" gltf-model="#model" position="0 0 -2"></a-entity>
    </a-scene>

    <div id="buttons">
        <button id="switch-camera">🔄 Cambiar Cámara</button>
        <button id="capture-btn">📷 Capturar</button>
    </div>

    <script>
        let usingFrontCamera = false;
        document.getElementById("switch-camera").addEventListener("click", () => {
            usingFrontCamera = !usingFrontCamera;
            document.querySelector("a-scene").setAttribute("arjs", `sourceType: webcam; facingMode: ${usingFrontCamera ? 'user' : 'environment'}`);
        });

        document.getElementById("capture-btn").addEventListener("click", () => {
            let scene = document.querySelector("a-scene");
            let rendererCanvas = scene.renderer.domElement;
            let image = rendererCanvas.toDataURL("image/png");
            
            let link = document.createElement("a");
            link.href = image;
            link.download = "captura_ar.png";
            link.click();
        });
    </script>
</body>
</html>
