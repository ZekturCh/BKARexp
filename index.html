<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo 3D con Sensibilidad Ajustada</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        button {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #loading {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: Arial;
        }
    </style>
</head>
<body>
    <div id="loading">Cargando modelo 3D...</div>
    <div id="buttons">
        <button id="take-photo">Tomar Foto</button>
    </div>

    <!-- Three.js y dependencias -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>

    <script>
        // —— Configuración inicial ——
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        let model; // Referencia al modelo cargado

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000); // Fondo negro
        document.body.appendChild(renderer.domElement);

        // —— Ajustes de sensibilidad ——
        const SENSIBILITY = {
            move: 0.005,    // Menor = más lento
            rotate: 0.002,  // Menor = más lento
            scale: 0.25     // Menor = menos sensible al pellizco
        };

        // —— Cargar modelo GLB desde GitHub ——
        const loader = new THREE.GLTFLoader();
        const modelURL = 'URL_DIRECTA_DE_TU_MODELO_AQUI.glb'; // <— Reemplazar con tu URL

        loader.load(
            modelURL,
            (gltf) => {
                model = gltf.scene;
                scene.add(model);
                document.getElementById('loading').style.display = 'none';
            },
            undefined,
            (error) => {
                console.error('Error al cargar el modelo:', error);
                alert('Error al cargar el modelo 3D');
            }
        );

        // —— Configurar cámara ——
        camera.position.z = 5;
        camera.position.y = 2;

        // —— Gestos táctiles ——
        const hammer = new Hammer(document.body);
        let scale = 1;

        // Mover (1 dedo)
        hammer.on('pan', (e) => {
            if (!model) return;
            model.position.x += e.deltaX * SENSIBILITY.move;
            model.position.y -= e.deltaY * SENSIBILITY.move;
        });

        // Rotar (2 dedos)
        hammer.get('rotate').set({ enable: true });
        hammer.on('rotate', (e) => {
            if (!model) return;
            model.rotation.y += e.rotation * SENSIBILITY.rotate;
        });

        // Escalar (pellizco)
        hammer.get('pinch').set({ enable: true });
        hammer.on('pinch', (e) => {
            if (!model) return;
            scale += (e.scale - 1) * SENSIBILITY.scale;
            scale = Math.max(0.1, Math.min(5, scale)); // Límites de escala
            model.scale.set(scale, scale, scale);
        });

        // —— Animación ——
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // —— Tomar foto ——
        document.getElementById('take-photo').addEventListener('click', () => {
            const dataURL = renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'foto-3d.png';
            link.click();
        });

        // —— Ajustar en resize ——
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
