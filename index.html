<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR - Manipulación de Modelo 3D</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
        }
    </style>
</head>
<body>
    <a-scene embedded arjs>
        <a-assets>
            <a-asset-item id="model" src="assets/asset.glb"></a-asset-item>
        </a-assets>
        <a-entity id="model-container" gltf-model="#model" position="0 0 -2" scale="1 1 1"></a-entity>
        <a-camera position="0 1.6 0"></a-camera>
    </a-scene>

    <div id="buttons">
        <button id="move-btn">Mover</button>
        <button id="rotate-btn">Rotar</button>
        <button id="scale-btn">Escalar</button>
        <button id="capture-btn">📸 Capturar</button>
    </div>

    <script>
        let model = document.getElementById("model-container");
        let mode = "";
        let lastX, lastY;

        document.getElementById("move-btn").addEventListener("click", () => mode = "move");
        document.getElementById("rotate-btn").addEventListener("click", () => mode = "rotate");
        document.getElementById("scale-btn").addEventListener("click", () => mode = "scale");

       function handleMove(event) {
    if (!mode) return;

    let clientX = event.touches ? event.touches[0].clientX : event.clientX;
    let clientY = event.touches ? event.touches[0].clientY : event.clientY;

    if (lastX === undefined || lastY === undefined) {
        lastX = clientX;
        lastY = clientY;
        return;
    }

    let deltaX = (clientX - lastX) * 0.5;  // Controla velocidad de rotación
    let deltaY = (clientY - lastY) * 0.5;

    let pos = model.getAttribute("position");
    let rot = model.getAttribute("rotation");
    let scale = model.getAttribute("scale");

    if (mode === "move") {
        model.setAttribute("position", `${pos.x + deltaX * 0.01} ${pos.y - deltaY * 0.01} ${pos.z}`);
    } else if (mode === "rotate") {
    let newRotX = rot.x - deltaY; // Rotar en X bajo su propio eje
    let newRotY = rot.y + deltaX; // Mantiene la rotación en Y
    
    // Corregimos el ángulo X para evitar movimientos extraños
    if (newRotX > 90) newRotX = 90;
    if (newRotX < -90) newRotX = -90;

    model.setAttribute("rotation", `${newRotX} ${newRotY} ${rot.z}`);
    } else if (mode === "scale") {
        let newScale = Math.max(0.2, scale.x + deltaY * 0.01);
        model.setAttribute("scale", `${newScale} ${newScale} ${newScale}`);
    }

    lastX = clientX;
    lastY = clientY;
}

        function resetLastTouch() {
            lastX = undefined;
            lastY = undefined;
        }

        document.addEventListener("mousemove", handleMove);
        document.addEventListener("touchmove", handleMove);
        document.addEventListener("mouseup", resetLastTouch);
        document.addEventListener("touchend", resetLastTouch);

document.getElementById("capture-btn").addEventListener("click", async () => {
    let scene = document.querySelector("a-scene"); 
    
    // Esconder botones antes de la captura
    document.getElementById("buttons").style.display = "none";
    document.getElementById("capture-btn").style.display = "none";

    // Captura la escena en un canvas
    let canvas = await html2canvas(scene, { backgroundColor: null });

    // Restaurar botones después de la captura
    document.getElementById("buttons").style.display = "flex";
    document.getElementById("capture-btn").style.display = "block";

    // Convertir el canvas a imagen
    let imageData = canvas.toDataURL("image/png");
    
    // Crear un enlace para descargar la imagen
    let link = document.createElement("a");
    link.href = imageData;
    link.download = "captura_ar.png";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    // Intentar guardar en la galería (funciona en algunos navegadores móviles)
    let blob = await (await fetch(imageData)).blob();
    let file = new File([blob], "captura_ar.png", { type: "image/png" });

    try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: "Mira mi AR" });
        } else {
            alert("Tu navegador no permite compartir archivos.");
        }
    } catch (err) {
        console.error("Error al compartir:", err);
    }
});
    </script>
</body>
</html>
