<!-- En la sección de carga del modelo, reemplaza la URL: -->
<script>
    // —— Cargar modelo desde GitHub (ramal main) ——
    const loader = new THREE.GLTFLoader();
    const modelURL = 'https://raw.githubusercontent.com/ZekturCh/BKTry9ru5th/main/assets/3dmodel.glb'; // ✅ URL corregida

    loader.load(
        modelURL,
        (gltf) => {
            model = gltf.scene;
            scene.add(model);
            document.getElementById('loading').style.display = 'none';
        },
        undefined,
        (error) => {
            console.error('Error:', error);
            alert('El modelo no se encontró. Verifica la URL.');
        }
    );
</script>
