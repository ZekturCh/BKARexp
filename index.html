<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro AR - Sin Trackeo y Guardado de Fotos</title>

    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
        #buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #take-photo { background: #28a745; color: white; }
        #share-instagram { background: #e4405f; color: white; }
    </style>
</head>
<body>

    <a-scene
        vr-mode-ui="enabled: false;"
        arjs="sourceType: webcam; debugUIEnabled: false;"
        embedded
    >
        <a-assets>
            <a-asset-item id="animated-asset" src="assets/asset.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 1.6 0"></a-camera>

        <!-- Modelo 3D sin trackeo -->
        <a-entity
            gltf-model="#animated-asset"
            position="0 -1 -3"
            scale="0.3 0.3 0.3"
            rotation="0 180 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 10000"
        ></a-entity>
    </a-scene>

    <!-- Botones -->
    <div id="buttons">
        <button id="take-photo">Tomar Foto</button>
        <button id="share-instagram">Compartir en Instagram</button>
    </div>

    <canvas id="photoCanvas" style="display:none;"></canvas>

    <script>
        // Tomar foto y guardarla en la galería
        document.getElementById("take-photo").addEventListener("click", function () {
            let video = document.querySelector("video");
            if (!video) {
                alert("No se encontró la cámara.");
                return;
            }

            let canvas = document.createElement("canvas");
            let context = canvas.getContext("2d");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Captura la imagen de la cámara
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Convierte a Blob para descargar
            canvas.toBlob(function (blob) {
                let url = URL.createObjectURL(blob);
                let link = document.createElement("a");
                link.href = url;
                link.download = "foto_ar.png";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);

                alert("Foto guardada en tu dispositivo.");
            }, "image/png");
        });

        // Compartir en Instagram
        document.getElementById("share-instagram").addEventListener("click", function () {
            let link = document.createElement("a");
            link.href = "instagram://story-camera";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>

</body>
</html>
