<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo 3D Manipulable</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        button {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="buttons">
        <button id="take-photo">Tomar Foto</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <script>
        // Configurar escena, cámara y renderizador
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Cargar modelo 3D (ejemplo: un cubo)
        const geometry = new THREE.BoxGeometry();
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);
        camera.position.z = 5;

        // Manejar gestos táctiles con Hammer.js
        const hammer = new Hammer(document.body);
        let scale = 1;
        let isDragging = false;

        // Escalar con pellizco
        hammer.get('pinch').set({ enable: true });
        hammer.on('pinch', (e) => {
            scale *= e.scale;
            cube.scale.set(scale, scale, scale);
        });

        // Rotar con dos dedos
        hammer.get('rotate').set({ enable: true });
        hammer.on('rotate', (e) => {
            cube.rotation.y += e.rotation * 0.01;
        });

        // Mover con un dedo
        hammer.on('pan', (e) => {
            cube.position.x = e.deltaX * 0.01;
            cube.position.y = -e.deltaY * 0.01;
        });

        // Animación
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Tomar foto
        document.getElementById('take-photo').addEventListener('click', () => {
            const dataURL = renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'foto.png';
            link.click();
        });

        // Ajustar en resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
