<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Código</title>
</head>
<body>
    <h2>Ingresa tu Código</h2>
    <input type="text" id="codigoInput" placeholder="Ingresa tu código">
    <button onclick="verificarCodigo()">Verificar</button>

    <script>
        async function verificarCodigo() {
            let codigoIngresado = document.getElementById("codigoInput").value.toUpperCase();
            let response = await fetch("data/codes.json");
            let codes = await response.json();

            if (codes[codigoIngresado]) {
                window.location.href = codes[codigoIngresado];
            } else {
                alert("Código no válido");
            }
        }
function validarCodigo() {
    let codigoIngresado = document.getElementById("codigo").value;
    let codigosValidos = ["ABC123", "XYZ789", "TEST456"]; // Lista de códigos válidos

    if (codigosValidos.includes(codigoIngresado)) {
        sessionStorage.setItem("accesoPermitido", "true"); // Guarda el acceso en sessionStorage
        window.location.href = "ar.html"; // Redirige a la página de AR
    } else {
        alert("Código incorrecto. Inténtalo de nuevo.");
    }
}
    </script>
</body>
</html>
