<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo 3D con A-Frame</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-gesture-recognition@1.1.0/dist/aframe-gesture-recognition.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #buttons { /* Estilos iguales que en el ejemplo anterior */ }
    </style>
</head>
<body>
    <a-scene>
        <a-assets>
            <a-asset-item id="model" src="assets/asset.glb"></a-asset-item>
        </a-assets>

        <a-entity
            gltf-model="#model"
            position="0 0 -3"
            gesture-recognition="maxScale: 2; minScale: 0.5"
        ></a-entity>

        <a-camera></a-camera>
    </a-scene>

    <div id="buttons">
        <button id="take-photo">Tomar Foto</button>
    </div>

    <script>
        // Tomar foto (similar al ejemplo anterior)
        document.getElementById('take-photo').addEventListener('click', () => {
            const scene = document.querySelector('a-scene');
            const canvas = scene.canvas;
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'foto.png';
            link.click();
        });
    </script>
</body>
</html>
