<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Código</title>
    <style>
        /* Estilos generales */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-image: url('assets/fondo.png'); /* Cambia esta ruta por la de tu imagen */
            background-size: cover; /* Cubre toda la pantalla */
            background-position: center; /* Centra la imagen */
            display: flex;
            justify-content: center; /* Centra horizontalmente */
            align-items: center; /* Centra verticalmente */
            height: 100vh; /* Altura completa de la ventana */
        }

        /* Estilos del contenedor del formulario */
        .form-container {
            background-color: #f5f5dc; /* Color crema */
            border: 2px solid #ff4500; /* Borde naranja intenso */
            border-radius: 10px; /* Esquinas redondeadas */
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); /* Sombra para darle profundidad */
            text-align: center; /* Centra el texto dentro del contenedor */
        }

        /* Estilos del input */
        #codigoInput {
            width: 80%; /* Ancho completo del contenedor */
            padding: 10px; /* Espaciado interno */
            border: none; /* Sin borde por defecto */
            border-radius: 5px; /* Esquinas redondeadas */
            margin-bottom: 15px; /* Espacio debajo del input */
        }

        /* Estilos del botón */
        button {
            background-color: #ff4500; /* Color naranja */
            color: white; /* Texto blanco */
            border: none; /* Sin borde por defecto */
            border-radius: 20px; /* Bordes redondeados */
            padding: 10px 20px; /* Espaciado interno del botón */
            cursor: pointer; /* Cambia el cursor al pasar sobre el botón */
            font-size: 16px; /* Tamaño de fuente del botón */
        }

        button:hover {
            opacity: 0.9; /* Efecto al pasar el ratón sobre el botón */
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Ingresa tu Código</h2>
        <input type="text" id="codigoInput" placeholder="Ingresa tu código">
        <button onclick="verificarCodigo()">Verificar</button>
    </div>
    <script>
        async function verificarCodigo() {
            let codigoIngresado = document.getElementById("codigoInput").value.toUpperCase();
            
            try {
                let response = await fetch("data/codes.json");
                
                if (!response.ok) {
                    throw new Error("No se pudo cargar el archivo codes.json");
                }

                let codes = await response.json();

                if (codes[codigoIngresado]) {
                    sessionStorage.setItem("accesoPermitido", "true"); // Guarda el acceso en sessionStorage
                    window.location.href = codes[codigoIngresado]; // Redirige a la página correspondiente
                } else {
                    alert("Código no válido");
                }
            } catch (error) {
                console.error("Error al cargar el archivo JSON:", error);
                alert("Hubo un problema al verificar el código. Inténtalo más tarde.");
            }
        }
    </script>
</body>
</html>
