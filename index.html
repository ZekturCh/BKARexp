<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro AR - Con Foto e Instagram</title>

    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
        #buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #take-photo { background: #28a745; color: white; }
        #share-instagram { background: #e4405f; color: white; }
    </style>
</head>
<body>

    <a-scene
        vr-mode-ui="enabled: false;"
        loading-screen="enabled: false;"
        renderer="logarithmicDepthBuffer: true;"
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
        embedded
        gesture-detector
    >
        <a-assets>
            <a-asset-item id="animated-asset" src="assets/asset.glb"></a-asset-item>
        </a-assets>

        <a-marker
            id="animated-marker"
            type="pattern"
            preset="custom"
            url="assets/marker.patt"
            raycaster="objects: .clickable"
            emitevents="true"
            cursor="fuse: false; rayOrigin: mouse;"
        >
            <a-entity
                id="bowser-model"
                scale="0.6 0.6 0.6"
                animation-mixer="loop: repeat"
                gltf-model="#animated-asset"
                class="clickable"
                gesture-handler
            ></a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <!-- Botones para tomar foto y compartir en Instagram -->
    <div id="buttons">
        <button id="take-photo">Tomar Foto</button>
        <button id="share-instagram">Compartir en Instagram</button>
    </div>

    <canvas id="photoCanvas" style="display:none;"></canvas>

    <script>
        // Tomar foto
        document.getElementById("take-photo").addEventListener("click", function () {
            let scene = document.querySelector("a-scene");
            let canvas = document.getElementById("photoCanvas");
            let context = canvas.getContext("2d");

            let video = document.querySelector("video");
            if (!video) {
                alert("No se encontró la cámara.");
                return;
            }

            // Tamaño del canvas igual al video
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Dibujamos la imagen de la cámara en el canvas
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Guardamos la foto
            let imageData = canvas.toDataURL("image/png");
            localStorage.setItem("photoAR", imageData);
            alert("Foto tomada. Ahora puedes compartirla en Instagram.");
        });

        // Compartir en Instagram
        document.getElementById("share-instagram").addEventListener("click", function () {
            let imageData = localStorage.getItem("photoAR");

            if (!imageData) {
                alert("Primero toma una foto.");
                return;
            }

            let link = document.createElement("a");
            link.href = imageData;
            link.download = "foto_ar.png";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // Intentamos abrir Instagram directamente
            window.location.href = "instagram://story-camera";
        });
    </script>

</body>
</html>
